<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1329;
    }

    .logo-container {
      width: 306px;
      height: 537px;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Общие стили для синих контуров ягод (R=50, длина окружности ≈ 314) */
    .grape-sharp {
      fill: none;
      stroke: #87CEFA;
      stroke-width: 2.5;
      stroke-dasharray: 315;
      stroke-dashoffset: 315;
    }

    .grape-neon {
      fill: none;
      stroke: #87CEFA;
      stroke-width: 5;
      stroke-dasharray: 315;
      stroke-dashoffset: 315;
      filter: 
        drop-shadow(0 0 4px #87CEFA) 
        drop-shadow(0 0 10px rgba(135, 206, 250, 0.9)) 
        drop-shadow(0 0 20px rgba(135, 206, 250, 0.4));
      opacity: 0;
    }

    /* Стили стебля (#00CC66, длина ≈ 450) */
    .stem-sharp {
      fill: none;
      stroke: #00CC66;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      opacity: 0;
    }

    .stem-neon {
      fill: none;
      stroke: #00CC66;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      filter: drop-shadow(0 0 6px rgba(0, 204, 102, 0.9)) drop-shadow(0 0 16px rgba(0, 204, 102, 0.45));
      opacity: 0;
    }

    /* Финальная мягкая заливка */
    .post-fill-berry {
      opacity: 0;
      fill: #87CEFA;
      animation: showFillBerry 0.6s ease 2.2s forwards;
    }

    .post-fill-stem {
      opacity: 0;
      fill: #00CC66;
      animation: showFillStem 0.6s ease 2.4s forwards;
    }

    /* --- 1. АНИМАЦИЯ ЯДРА (Центр: cx=153, cy=287) --- */
    #core-group {
      transform-origin: 153px 287px;
      animation: coreShrink 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
    }
    #core-group .grape-sharp {
      animation: drawCircleLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards;
    }
    #core-group .grape-neon {
      animation: igniteNeonCircle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    /* --- 2. АНИМАЦИЯ СПУТНИКОВ (Вылет из 153, 287) --- */
    /* Каждая группа-спутник стартует в точке (153, 287) и летит на свои дельта-координаты */
    .sat-item {
      transform-origin: 153px 287px;
      opacity: 0;
      transform: translate(0px, 0px) scale(0.15);
      animation: flyOutSat 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .sat-item .grape-sharp {
      animation: drawCircleLine 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .sat-item .grape-neon {
      animation: igniteNeonCircle 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Задаем конечные смещения относительно центра (153, 287) */
    /* up: (100, 187) -> dx: -53, dy: -100 */
    .sat-up-1   { --tx:  -53px; --ty: -100px; animation-delay: 1.05s; }
    /* up: (206, 187) -> dx: +53, dy: -100 */
    .sat-up-2   { --tx:   53px; --ty: -100px; animation-delay: 1.15s; }
    /* center: (50, 287) -> dx: -103, dy: 0 */
    .sat-mid-1  { --tx: -103px; --ty:    0px; animation-delay: 1.25s; }
    /* center: (256, 287) -> dx: +103, dy: 0 */
    .sat-mid-2  { --tx:  103px; --ty:    0px; animation-delay: 1.35s; }
    /* down: (100, 387) -> dx: -53, dy: +100 */
    .sat-down-1 { --tx:  -53px; --ty:  100px; animation-delay: 1.45s; }
    /* down: (206, 387) -> dx: +53, dy: +100 */
    .sat-down-2 { --tx:   53px; --ty:  100px; animation-delay: 1.55s; }
    /* down-mid: (150, 487) -> dx: -3, dy: +200 */
    .sat-down-3 { --tx:   -3px; --ty:  200px; animation-delay: 1.65s; }

    /* Синхронизация задержек дочерних path/circle внутри спутников */
    .sat-up-1   .grape-sharp { animation-delay: 1.05s; } .sat-up-1   .grape-neon { animation-delay: 1.30s; }
    .sat-up-2   .grape-sharp { animation-delay: 1.15s; } .sat-up-2   .grape-neon { animation-delay: 1.40s; }
    .sat-mid-1  .grape-sharp { animation-delay: 1.25s; } .sat-mid-1  .grape-neon { animation-delay: 1.50s; }
    .sat-mid-2  .grape-sharp { animation-delay: 1.35s; } .sat-mid-2  .grape-neon { animation-delay: 1.60s; }
    .sat-down-1 .grape-sharp { animation-delay: 1.45s; } .sat-down-1 .grape-neon { animation-delay: 1.70s; }
    .sat-down-2 .grape-sharp { animation-delay: 1.55s; } .sat-down-2 .grape-neon { animation-delay: 1.80s; }
    .sat-down-3 .grape-sharp { animation-delay: 1.65s; } .sat-down-3 .grape-neon { animation-delay: 1.90s; }

    /* --- 3. АНИМАЦИЯ СТЕБЛЯ (В конце) --- */
    .stem-sharp { animation: drawStemLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) 2.1s forwards; }
    .stem-neon  { animation: igniteStemNeon 0.9s cubic-bezier(0.16, 1, 0.3, 1) 2.3s forwards; }

    /* KEYFRAMES */
    @keyframes drawCircleLine {
      0%   { stroke-dashoffset: 315; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes igniteNeonCircle {
      0%   { opacity: 0; stroke-dashoffset: 315; }
      25%  { opacity: 1; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes coreShrink {
      0%   { transform: scale(1.65); }
      100% { transform: scale(1); }
    }

    @keyframes flyOutSat {
      0%   { opacity: 0; transform: translate(0px, 0px) scale(0.15); }
      20%  { opacity: 1; }
      100% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
    }

    @keyframes drawStemLine {
      0%   { opacity: 1; stroke-dashoffset: 450; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes igniteStemNeon {
      0%   { opacity: 0; stroke-dashoffset: 450; }
      25%  { opacity: 1; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes showFillBerry {
      to { opacity: 0.12; }
    }
    @keyframes showFillStem {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg class="logo-svg" viewBox="0 0 306 537" xmlns="http://www.w3.org/2000/svg">
      
      <!-- 1. Финальная полупрозрачная заливка всех ягод -->
      <g class="post-fill-berry">
        <circle cx="100" cy="187" r="50" />
        <circle cx="206" cy="187" r="50" />
        <circle cx="50"  cy="287" r="50" />
        <circle cx="153" cy="287" r="50" />
        <circle cx="256" cy="287" r="50" />
        <circle cx="100" cy="387" r="50" />
        <circle cx="206" cy="387" r="50" />
        <circle cx="150" cy="487" r="50" />
      </g>

      <!-- Финальная заливка стебля -->
      <path class="post-fill-stem" d="M102.248 3.72232C131.451 12.0258 182.531 50.1371 153.232 136.155L66.0489 85.2406C86.6126 80.1399 132.839 83.1818 153.232 136.155L102.248 3.72232Z"/>

      <!-- 2. Спутниковые ягоды (все изначально отрисованы в центре cx=153, cy=287, при полете смещаются через translate) -->
      <!-- Up 1 -->
      <g class="sat-item sat-up-1">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Up 2 -->
      <g class="sat-item sat-up-2">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Mid 1 -->
      <g class="sat-item sat-mid-1">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Mid 2 -->
      <g class="sat-item sat-mid-2">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Down 1 -->
      <g class="sat-item sat-down-1">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Down 2 -->
      <g class="sat-item sat-down-2">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>
      <!-- Down 3 -->
      <g class="sat-item sat-down-3">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>

      <!-- 3. Центральное ядро (остается на месте, но сжимается от scale(1.65) до scale(1)) -->
      <g id="core-group">
        <circle cx="153" cy="287" r="50" class="grape-sharp" />
        <circle cx="153" cy="287" r="50" class="grape-neon" />
      </g>

      <!-- 4. Зелёный стебель -->
      <path class="stem-sharp" d="M102.248 3.72232C131.451 12.0258 182.531 50.1371 153.232 136.155L66.0489 85.2406C86.6126 80.1399 132.839 83.1818 153.232 136.155L102.248 3.72232Z"/>
      <path class="stem-neon"  d="M102.248 3.72232C131.451 12.0258 182.531 50.1371 153.232 136.155L66.0489 85.2406C86.6126 80.1399 132.839 83.1818 153.232 136.155L102.248 3.72232Z"/>

    </svg>
  </div>

</body>
</html>
